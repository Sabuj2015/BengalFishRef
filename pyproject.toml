[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bengalfishref"
version = "1.0.0"
description = "BengalFishRef: Phylogenetically audited mitochondrial reference atlas, eDNA primer benchmark, and serverless identification platform for fishes and commercial crustaceans of Bangladesh and the Bay of Bengal (FBD-NIB)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Sabuj Biswas", email = "fbd@nib.gov.bd" }
]
dependencies = [
    "biopython>=1.84",
    "matplotlib>=3.9",
    "numpy>=2.0",
    "pandas>=2.2",
    "polite-http>=0.1.4",
    "python-docx>=1.2.0",
    "python-dotenv>=1.0",
    "requests>=2.32",
    "scikit-learn>=1.5",
    "scipy>=1.14",
    "seaborn>=0.13",
]

[project.scripts]
bengalfishref = "bengalfishref.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bengalfishref"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
